
name: Dataset Preprocessing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle

      - name: Download Dataset from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p dataset_5_class_animal_raw
          kaggle datasets download \
            unamawillyr/animal-5-classification \
            --path dataset_5_class_animal_raw \
            --unzip

      - name: Inspect Dataset Structure
        run: |
          echo "Menampilkan struktur awal dataset:"
          find dataset_5_class_animal_raw -maxdepth 3 -type d | head -50

      - name: Run Automated Preprocessing
        run: |
          python preprocessing/automate_Nama-siswa.py

      - name: Verify Processed Dataset
        run: |
          test -d preprocessing/dataset_5_class_animal_preprocessing/train
          test -d preprocessing/dataset_5_class_animal_preprocessing/validation
          test -d preprocessing/dataset_5_class_animal_preprocessing/test
          test -s preprocessing/dataset_5_class_animal_preprocessing/manifest.csv

          echo "Dataset berhasil diproses."

      - name: Upload Processed Dataset
        uses: actions/upload-artifact@v4
        with:
          name: animal-5-class-preprocessed
          path: preprocessing/dataset_5_class_animal_preprocessing/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0